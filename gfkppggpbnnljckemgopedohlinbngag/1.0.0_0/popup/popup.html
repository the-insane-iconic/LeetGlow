<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetThemes</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">
          <img src="../assets/icons/icon48.png" alt="" width="30" height="30">
          <span class="spark" aria-hidden="true"></span>
        </div>
        <div class="brand-text">
          <h1>Leet<span>Themes</span></h1>
          <p>theme your grind</p>
        </div>
      </div>
      <label class="switch" title="Enable LeetThemes">
        <input type="checkbox" id="masterToggle" aria-label="Enable LeetThemes">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <div class="banner hidden" id="siteBanner">
      <div class="banner-copy">
        <strong>You're not on LeetCode</strong>
        <span>Pick a vibe — it'll be waiting for you.</span>
      </div>
      <button class="banner-btn" id="openLeetcode">Open</button>
    </div>

    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.1 11.6l4.2 4.2 1.4-1.4-4.2-4.2A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" fill="currentColor"/></svg>
        <input type="text" id="search" placeholder="search the vibes..." autocomplete="off" spellcheck="false">
      </label>
      <button class="icon-btn" id="settingsBtn" title="Theme studio & settings" aria-label="Theme studio and settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2Zm9 4.8-2.1.5a7.2 7.2 0 0 1-.7 1.7l1.1 1.9-1.7 1.7-1.9-1.1a7.2 7.2 0 0 1-1.7.7L14.5 21h-5l-.5-2.1a7.2 7.2 0 0 1-1.7-.7L5.4 19.3l-1.7-1.7 1.1-1.9a7.2 7.2 0 0 1-.7-1.7L2 13.5v-3l2.1-.5a7.2 7.2 0 0 1 .7-1.7L3.7 6.4l1.7-1.7 1.9 1.1a7.2 7.2 0 0 1 1.7-.7L9.5 3h5l.5 2.1a7.2 7.2 0 0 1 1.7.7l1.9-1.1 1.7 1.7-1.1 1.9a7.2 7.2 0 0 1 .7 1.7l2.1.5v3Z" fill="currentColor"/></svg>
      </button>
    </div>

    <nav class="chips" id="chips" aria-label="Theme categories"></nav>

    <main class="grid" id="grid" aria-live="polite"></main>
    <div class="empty hidden" id="empty">
      <span class="empty-emoji">🫧</span>
      <strong>no vibes found</strong>
      <p>Try a different search or build a custom theme in the studio.</p>
      <button class="empty-btn" id="emptyStudio">Open Theme Studio</button>
    </div>

    <footer class="quick">
      <button class="quick-btn" data-action="focus" title="Toggle focus mode (Alt+Shift+F)">
        <span class="q-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm14 0h2v5h-5v-2h3v-3Z" fill="currentColor"/></svg>
        </span>
        <span>Focus</span>
      </button>
      <button class="quick-btn" data-action="audio" title="Toggle lofi audio (Alt+Shift+M)">
        <span class="q-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z" fill="currentColor"/></svg>
        </span>
        <span>Lofi</span>
      </button>
      <button class="quick-btn" data-action="timer" title="Toggle pomodoro (Alt+Shift+D)">
        <span class="q-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v2H9V2Zm3 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm1 3h-2v6l4.2 2.5 1-1.7-3.2-1.9V9Z" fill="currentColor"/></svg>
        </span>
        <span>Timer</span>
      </button>
      <button class="quick-btn studio" data-action="studio" title="Custom themes, colors and backgrounds">
        <span class="q-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.3 0 2-.8 2-2 0-.6-.2-1.1-.6-1.5-.3-.4-.4-.7-.4-1 0-.7.5-1.2 1.3-1.2H16a5 5 0 0 0 5-5.1C21 6.6 17 3 12 3Zm-4.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm2.8-4.2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4.4 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3.3 3.2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="currentColor"/></svg>
        </span>
        <span>Studio</span>
      </button>
    </footer>
  </div>

  <div class="pop-toast hidden" id="popToast" role="status"></div>

  <script src="../shared/themes.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
