<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>LeetGlow - Custome Theme & Sound Effects and Background</title>
</head>
<body>
  <header class="head">
    <img class="mark" src="../icons/logo.png" alt="LeetGlow Logo" width="32" height="32" aria-hidden="true" />
    <div class="head-text">
      <h1>LeetGlow</h1>
      <p>Pick a look for the LeetCode problem page. Applies instantly.</p>
    </div>
  </header>

  <main id="grid" class="grid" role="radiogroup" aria-label="LeetCode themes"></main>

  <button id="studio" class="studio" type="button">
    <span class="studio-jp" aria-hidden="true"><i>ア</i><i>ニ</i><i>メ</i></span>
    <span class="studio-text"><b>Open Anime Studio</b><span>Use your own picture, tune the glass, preview the moments</span></span>
    <span class="studio-arrow" aria-hidden="true">→</span>
  </button>

  <footer class="foot">
    <span id="status">Covers the editor, panels, console and syntax.</span>
    <button id="support" class="support" type="button" title="LeetGlow is free. If it makes your grind nicer, you can chip in.">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s-5.5-3.4-5.5-7.1A3 3 0 0 1 8 4.6a3 3 0 0 1 5.5 2.3C13.5 10.6 8 14 8 14Z"/></svg>Support
    </button>
    <button id="bug" class="support bug" type="button" title="Found a bug? Email AnshYadav (opens Gmail with a short template).">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 4.6a2.2 2.2 0 0 1 4.4 0Z"/><path d="M4.8 7a3.2 3.2 0 0 1 6.4 0v2.8a3.2 3.2 0 0 1-6.4 0Z"/><path class="legs" d="M2.2 7.4h2.4M11.4 7.4h2.4M2.4 11.2l2.3-.9M13.6 11.2l-2.3-.9M3.2 3.6l1.8 1.6M12.8 3.6 11 5.2"/></svg>Report bug
    </button>
    <button id="connect" class="support connect" type="button" title="Connect with AnshYadav on LinkedIn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 5.6h2.5V14H2.2zM3.45 1.8a1.45 1.45 0 1 1 0 2.9 1.45 1.45 0 0 1 0-2.9zM6.3 5.6h2.4v1.15h.03c.34-.63 1.15-1.3 2.37-1.3 2.53 0 3 1.67 3 3.83V14h-2.5V9.8c0-1-.02-2.3-1.4-2.3-1.4 0-1.6 1.1-1.6 2.22V14H6.3z"/></svg>Connect
    </button>
    <span id="ver" class="ver"></span>
  </footer>

  <script src="anime/scenes.js"></script>
  <script src="pixel/sprites.js"></script>
  <script src="support.js"></script>
  <script src="popup.js"></script>
</body>
</html>
